# Frontend'i sunar ve /api isteklerini api servisine iletir.
# Tarayıcı yalnız bu kökenle (localhost:3000) konuşur; ayrı bir kökene istek olmadığı için CORS gerekmez.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Docker'ın iç DNS'i. api konteyneri yeniden başlayıp yeni IP alırsa adres 10 sn içinde yeniden çözülür;
    # proxy_pass'te değişken kullanılması nginx'in adresi yalnız açılışta çözüp sabitlemesini engeller.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $api_upstream http://api:8080;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # nginx'in istek kimliği API'ye geçer; iki servisin logları aynı kimlikle eşleştirilebilir.
        proxy_set_header X-Request-ID $request_id;
    }

    # Konteynerin kendi sağlık kontrolü (API'den bağımsız).
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Vite'ın ürettiği dosya adları içerik özeti taşır; değişmeyecekleri için uzun süre önbelleklenir.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Tek sayfalık uygulama: bilinmeyen yollar index.html'e düşer, yönlendirmeyi React Router yapar.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
