# ParaKöprü — tüm sistem tek komutla:
#   cp .env.example .env
#   docker compose up --build
#
# Kurallar (proje.md §3):
#   - Her servisin healthcheck'i var; her depends_on "service_healthy" koşuluyla bekler.
#   - Tüm konteynerler root olmayan kullanıcıyla çalışır.
#   - Veritabanı host'a açılmaz; yalnız compose ağından erişilir.
#   - Migrasyon api açılışında otomatik çalışır; elle adım yoktur.
#
# Değişkenler .env dosyasından okunur; eksikse compose anlaşılır bir hatayla durur.

name: parakopru

services:
  postgres:
    build: ./deploy/postgres
    image: parakopru-postgres:local
    user: postgres
    # WAL arşivi (T-7): her tamamlanan WAL parçası /wal_archive'a kopyalanır; temel yedek (pg_basebackup) ile birlikte
    # belirli bir ana geri dönmeyi (PITR) sağlar. archive_timeout: trafik azken de en geç 15 sn'de parça arşivlenir.
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - archive_mode=on
      - -c
      - archive_timeout=15
      - -c
      - archive_command=test ! -f /wal_archive/%f && cp %p /wal_archive/%f
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?.env eksik - once 'cp .env.example .env' calistirin}
      POSTGRES_USER: ${POSTGRES_USER:?.env eksik}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?.env eksik}
      # Rol başlangıç betiği (deploy/postgres/initdb) uygulama kullanıcısını bu değerlerle oluşturur.
      APP_DB_USER: ${APP_DB_USER:?.env eksik}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?.env eksik}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - walarchive:/wal_archive
      - ./deploy/postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 10s
    restart: unless-stopped

  api:
    build: ./backend
    image: parakopru-backend:local
    command: ["/app/api"]
    environment:
      DATABASE_URL: postgres://${APP_DB_USER}:${APP_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      MIGRATION_DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      LOG_LEVEL: ${LOG_LEVEL:-info}
      JWT_SECRET: ${JWT_SECRET:?.env eksik}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-15m}
      REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL:-168h}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      DEMO_PASSWORD: ${DEMO_PASSWORD:?.env eksik}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/app/healthcheck", "http://localhost:8080/health"]
      interval: 3s
      timeout: 4s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  # Zamanlanmış işler ve iş kuyruğu (proje.md §4 "Sistem" rolü). api ile aynı imaj, farklı komut.
  # Migrasyon çalıştırmaz; api sağlıklı olduğunda şema hazırdır. /health yalnız compose ağında açıktır.
  worker:
    build: ./backend
    image: parakopru-backend:local
    command: ["/app/worker"]
    environment:
      DATABASE_URL: postgres://${APP_DB_USER}:${APP_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      LOG_LEVEL: ${LOG_LEVEL:-info}
      BANK_URL: http://simulator:8080
      # Gün sonu çökme testi: > 0 ise worker bu kadar partiden sonra kendini öldürür (bkz. TESTING.md "Gün sonu").
      EOD_CRASH_AFTER_BATCHES: ${EOD_CRASH_AFTER_BATCHES:-0}
      EOD_BATCH_SIZE: ${EOD_BATCH_SIZE:-1000}
      WORKER_JOB_LEASE: ${WORKER_JOB_LEASE:-2m}
    depends_on:
      api:
        condition: service_healthy
      simulator:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/app/healthcheck", "http://localhost:8080/health"]
      interval: 3s
      timeout: 4s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  # Veri üretici (proje.md §8): açılışta tohumlu 20.000 müşteri ve hesaplarını toplu yazar (açılış bakiyeleri defterden
  # geçer); aynı tohumla yapılmışsa atlar. Seed bitince healthy olur; verify ancak o zaman başlar.
  simulator:
    build: ./backend
    image: parakopru-backend:local
    command: ["/app/simulator"]
    environment:
      DATABASE_URL: postgres://${APP_DB_USER}:${APP_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SIM_SEED: ${SIM_SEED:-20261026}
      SIM_CUSTOMERS: ${SIM_CUSTOMERS:-20000}
      BANK_FAILURE_PERCENT: ${BANK_FAILURE_PERCENT:-20}
      BANK_DUPLICATE_PERCENT: ${BANK_DUPLICATE_PERCENT:-10}
      # Banka bildirimleri API'ye "sistem" rolündeki hesapla gönderilir.
      SIM_API_URL: http://api:8080
      SIM_SYSTEM_PASSWORD: ${DEMO_PASSWORD:?.env eksik}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/app/healthcheck", "http://localhost:8080/health"]
      interval: 3s
      timeout: 4s
      retries: 40
      start_period: 10s
    restart: unless-stopped

  frontend:
    build: ./frontend
    image: parakopru-frontend:local
    ports:
      - "3000:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  # Uçtan uca doğrulama (proje.md §10): `make verify` ile tek seferlik çalışır, sürekli açık kalmaz.
  # Ayaktaki sisteme compose ağı içinden bağlanır; her kimlik için PASS/FAIL tablosu basar,
  # bir FAIL bile varsa çıkış kodu 1 olur.
  verify:
    profiles: ["verify"]
    build: ./backend
    image: parakopru-backend:local
    command: ["/app/verify"]
    environment:
      VERIFY_API_URL: http://api:8080
      VERIFY_FRONTEND_URL: http://frontend:8080
      DEMO_PASSWORD: ${DEMO_PASSWORD:?.env eksik}
      VERIFY_MIN_CUSTOMERS: ${SIM_CUSTOMERS:-20000}
      VERIFY_PITR_RESULT: /verify-out/pitr-result.txt
    volumes:
      # scripts/dr/pitr-demo.sh sonucunu buraya yazar (make verify önce onu çalıştırır); T-7 ikisi de geçerse PASS olur.
      - ./.verify:/verify-out:ro
    depends_on:
      api:
        condition: service_healthy
      simulator:
        condition: service_healthy
      worker:
        condition: service_healthy
      frontend:
        condition: service_healthy
    # Tek seferlik bir iş olsa da "her servis healthcheck içerir" kuralına uyar: API'ye erişebiliyor mu?
    healthcheck:
      test: ["CMD", "/app/healthcheck", "http://api:8080/health"]
      interval: 5s
      timeout: 4s
      retries: 3

volumes:
  pgdata:
  walarchive:
