# Sürekli entegrasyon (proje.md §9): build + test + lint + govulncheck + konteyner imajı derleme.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (build, test, lint, govulncheck)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # go.mod'daki 1.27.0 yerine 1.27'in en son yaması: 1.27.0'daki standart kütüphane zafiyetleri
          # (GO-2026-6809 x509, GO-2026-6617 http2) govulncheck'i kırar; düzeltmeler yamalarda.
          go-version: "1.27"
          check-latest: true
          cache-dependency-path: backend/go.sum

      - name: Build
        run: go build ./...

      # Veritabanı testleri testcontainers ile gerçek PostgreSQL 16 açar; ubuntu-latest'te Docker hazırdır.
      - name: Test (yarış dedektörüyle)
        run: go test -race -count=1 ./...

      # Sürüm Makefile'daki ile aynı olmalı (make lint).
      - name: Lint
        run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0 run ./...

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  frontend:
    name: Frontend (lint, build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run build

  images:
    name: Konteyner imajları
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Yalnız derlenir (push yok): Dockerfile'lar ve imajların çalışma imajına sığdığı doğrulanır.
      - name: Backend imajı (api, worker, simulator, verify, healthcheck)
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
      - name: Frontend imajı
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: false
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max
