openapi: 3.0.3
info:
  title: ParaKöprü API
  version: 0.1.0
  description: |
    Dijital banka çekirdeği: hesaplar, çift taraflı defter, transferler, kart provizyonları,
    faiz, risk kuralları ve mutabakat.

    - Tutarlar her zaman tam sayı `amount_minor` (kuruş/sent) + `currency` olarak taşınır; ondalıklı sayı kullanılmaz.
    - Her hata `{"error":{"code","message"}}` biçimindedir.
    - Her yanıtta `X-Request-ID` başlığı döner; istekte geçerli bir `X-Request-ID` gönderilirse aynısı kullanılır.
    - Kimlik doğrulama: `POST /api/v1/auth/login` ile alınan access token `Authorization: Bearer <token>` başlığıyla gönderilir.
      Refresh token `pk_refresh` adlı HttpOnly çerezdedir. Token yok ya da geçersizse 401, rolün izni yoksa 403 döner.
servers:
  - url: http://localhost:8080

# Varsayılan: her uç access token ister. Girişsiz uçlar kendi tanımlarında `security: []` ile belirtilir.
security:
  - bearerAuth: []

paths:
  /api/v1/auth/login:
    post:
      summary: Giriş
      description: E-posta ve parolayı doğrular; access token'ı gövdede, refresh token'ı HttpOnly çerezde döner.
      tags: [Kimlik]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
            example: { email: operasyon@parakopru.test, password: ParaKopru.2026 }
      responses:
        "200":
          description: Giriş başarılı
          headers:
            Set-Cookie:
              description: "`pk_refresh=<token>; Path=/api/v1/auth; HttpOnly; SameSite=Strict`"
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401":
          description: E-posta ya da parola hatalı (`INVALID_CREDENTIALS`); hangisinin yanlış olduğu söylenmez
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /api/v1/auth/refresh:
    post:
      summary: Oturumu yenile
      description: |
        `pk_refresh` çerezindeki token karşılığında yeni access ve refresh token verir; eski refresh token iptal edilir.
        İptal edilmiş bir token tekrar kullanılırsa kullanıcının bütün oturumları kapatılır.
      tags: [Kimlik]
      security: []
      responses:
        "200":
          description: Yeni oturum
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "401":
          description: Çerez yok, geçersiz, süresi dolmuş ya da iptal edilmiş (`SESSION_EXPIRED`)
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /api/v1/auth/logout:
    post:
      summary: Çıkış
      description: Refresh token'ı iptal eder ve çerezi siler. Çerez yoksa da 204 döner.
      tags: [Kimlik]
      security: []
      responses:
        "204": { description: Çıkış yapıldı }

  /api/v1/me:
    get:
      summary: Oturumdaki kullanıcı ve izinleri
      description: "İzin: `profile:read` (her rol). Arayüz menüyü `permissions` listesine göre süzer."
      tags: [Kimlik]
      responses:
        "200":
          description: Kullanıcı
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/audit-log:
    get:
      summary: Denetim kaydı (en yeni önce, keyset sayfalı)
      description: |
        İzin: `audit:read` (uyum uzmanı, denetçi). Kayıtlar eklemeli-yalnızdır; değiştirilemez ve silinemez.
        Her kayıt: kim (`actor_id`, `actor_role`), ne zaman (`at`), neyi (`action`, `entity`, `entity_id`),
        eski ve yeni değer (`old_value`, `new_value`) ve isteğin kimliği (`request_id`).
      tags: [Denetim]
      parameters:
        - { name: entity, in: query, schema: { type: string, maxLength: 100 }, description: "Ör. transfer" }
        - { name: entity_id, in: query, schema: { type: string, maxLength: 100 } }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Sayfa
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/AuditRecord" } }
                  next_cursor: { type: string, nullable: true, description: "Son sayfada null" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/customers:
    post:
      summary: Müşteri aç
      description: "İzin: `customers:write` (operasyon uzmanı). Denetim kaydına `customer.create` yazılır."
      tags: [Müşteri ve hesap]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CustomerCreate" }
      responses:
        "201": { description: Açıldı, content: { application/json: { schema: { $ref: "#/components/schemas/Customer" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: Aynı kimlik numarasıyla müşteri var (`CUSTOMER_EXISTS`)
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    get:
      summary: Müşteriler (en yeni önce, keyset sayfalı)
      description: "İzin: `ledger:read` (operasyon, risk, uyum, denetçi)."
      tags: [Müşteri ve hesap]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Sayfa
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Customer" } }
                  next_cursor: { type: string, nullable: true }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/customers/{id}:
    get:
      summary: Müşteri
      description: "İzin: `ledger:read`."
      tags: [Müşteri ve hesap]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Müşteri, content: { application/json: { schema: { $ref: "#/components/schemas/Customer" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/accounts:
    post:
      summary: Müşteri hesabı aç (vadesiz ya da vadeli; TRY/USD/EUR)
      description: |
        İzin: `customers:write` (operasyon uzmanı). IBAN otomatik üretilir (TR, kontrol haneli).
        Vadeli hesapta ileri bir `maturity_date` zorunlu, vadesizde yasak. Denetim kaydına `account.open` yazılır.
      tags: [Müşteri ve hesap]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AccountOpen" }
            example: { customer_id: 01a18dce-fd1b-76df-b41d-47b121bde845, kind: TIME_DEPOSIT, currency: EUR, maturity_date: "2027-06-30" }
      responses:
        "201": { description: Açıldı, content: { application/json: { schema: { $ref: "#/components/schemas/Account" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    get:
      summary: Hesaplar ve bakiyeleri
      description: |
        İzin: `own_banking` ya da `ledger:read`. Müşteri yalnız kendi hesaplarını görür (`customer_id` yok sayılır).
        `ledger:read` sahibi roller tüm hesapları (bankanın iç hesapları dahil) ya da `customer_id` ile süzülmüş listeyi görür.
      tags: [Müşteri ve hesap]
      parameters:
        - { name: customer_id, in: query, schema: { type: string, format: uuid } }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Sayfa
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Account" } }
                  next_cursor: { type: string, nullable: true }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/accounts/{id}:
    get:
      summary: Hesap ve bakiyesi
      description: "İzin: `own_banking` ya da `ledger:read`. Müşteri başka bir müşterinin hesabını isterse 403."
      tags: [Müşteri ve hesap]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Hesap, content: { application/json: { schema: { $ref: "#/components/schemas/Account" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/accounts/{id}/entries:
    get:
      summary: Hesap hareketleri (en yeni önce, keyset sayfalı)
      description: |
        İzin: `own_banking` ya da `ledger:read`. Müşteri başka bir müşterinin hesabını isterse 403.
        Her hareket bir defter satırıdır: yön (`side`), pozitif tutar ve bakiyeye etkisi (`balance_effect_minor`;
        müşteri hesabında para girişi +, çıkışı −). Hareketlerin toplamı hesabın bakiyesidir.
        `as_of` / `known_at` (zaman yolculuğu) F1 adımında eklenecek.
      tags: [Defter]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Sayfa
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/AccountPosting" } }
                  next_cursor: { type: string, nullable: true }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/ledger/entries/{id}:
    get:
      summary: Yevmiye kaydı ve bütün satırları (borç ve alacak tarafları)
      description: |
        İzin: `ledger:read` (operasyon, risk, uyum, denetçi). Her para biriminde borç toplamı = alacak toplamı.
        Kayıt ters çevrildiyse `reversed_by` ters kaydı gösterir; özgün kayıt değişmez.
      tags: [Defter]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Kayıt, content: { application/json: { schema: { $ref: "#/components/schemas/JournalEntry" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/ledger/entries/{id}/reverse:
    post:
      summary: Ters kayıt (düzeltme)
      description: |
        İzin: `ledger:reverse` (operasyon uzmanı). Defter satırları silinmez ve güncellenmez; düzeltme, özgün kaydın
        satırlarının tersini yazan yeni bir kayıtla yapılır. Bir kayıt yalnız bir kez ters çevrilebilir; ters kayıt
        yeniden ters çevrilemez. Elle yalnız bir sürece ait olmayan kayıtlar (ör. `OPENING_BALANCE`) ters çevrilebilir;
        transfer, kart ve faiz kayıtları kendi akışlarıyla düzeltilir. Denetim kaydına `ledger.reverse` yazılır.
      tags: [Defter]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReverseRequest" }
            example: { reason: Hatalı açılış bakiyesi }
      responses:
        "201":
          description: Ters kayıt yazıldı
          headers:
            Idempotent-Replayed: { $ref: "#/components/headers/IdempotentReplayed" }
          content: { application/json: { schema: { $ref: "#/components/schemas/JournalEntry" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Kayıt zaten ters çevrilmiş (`ALREADY_REVERSED`)
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "422":
          description: |
            Elle ters çevrilemez (`ENTRY_NOT_REVERSIBLE`), ters kayıt için bakiye yetersiz (`INSUFFICIENT_FUNDS`)
            ya da aynı Idempotency-Key farklı bir istekle kullanılmış (`IDEMPOTENCY_KEY_REUSED`)
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /api/v1/transfers:
    post:
      summary: Transfer başlat (banka içi havale)
      description: |
        İzin: `transfers:create` (müşteri yalnız kendi hesabından, operasyon uzmanı herhangi bir müşteri hesabından).
        Alıcı IBAN ile verilir. IBAN bankanın kendi hesabıysa transfer banka içidir (INTERNAL) ve hemen tamamlanır;
        değilse dış bankaya gider (`type`: EFT ya da FAST, varsayılan FAST): para önce takas hesabına ayrılır (`RESERVED`),
        gönderim worker'da arka planda yapılır ve sonuç `GET /transfers/{id}` ile izlenir
        (`RESERVED → SENT → COMPLETED`; belirsizse `UNKNOWN`, banka reddederse `FAILED → REVERSED`: ters kayıtla para müşteriye döner).
        Farklı para birimi `422 CURRENCY_MISMATCH` döner (çok para birimi ayrı adımda).
        Transfer, defter kaydı, denetim kaydı ve (dış transferde) gönderim işi tek transaction'da yazılır. Aynı `Idempotency-Key` ile tekrar istek
        aynı sonucu döndürür (`Idempotent-Replayed: true`). Yetersiz bakiye `422 INSUFFICIENT_FUNDS` döner; bu da bir
        sonuçtur: `REJECTED` bir transfer kaydı yazılır (kimliği `X-Transfer-ID` başlığında) ve tekrar istek aynı reddi alır.
      tags: [Transfer]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TransferCreate" }
            example: { from_account_id: 01a18de1-0448-7b9f-b5b8-129e6247d547, to_iban: TR450099900000000000000001, amount_minor: 25000, currency: TRY, description: Kira }
      responses:
        "201":
          description: Banka içi transfer tamamlandı
          headers:
            Idempotent-Replayed: { $ref: "#/components/headers/IdempotentReplayed" }
          content: { application/json: { schema: { $ref: "#/components/schemas/Transfer" } } }
        "202":
          description: Dış transfer kabul edildi (`RESERVED`); bankaya gönderim arka planda yapılır
          headers:
            Idempotent-Replayed: { $ref: "#/components/headers/IdempotentReplayed" }
          content: { application/json: { schema: { $ref: "#/components/schemas/Transfer" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: |
            `INSUFFICIENT_FUNDS`, `CURRENCY_MISMATCH`, `SAME_ACCOUNT`, `ACCOUNT_NOT_ACTIVE`,
            `ACCOUNT_NOT_ALLOWED` ya da `IDEMPOTENCY_KEY_REUSED`
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    get:
      summary: Transferler (en yeni önce, keyset sayfalı)
      description: |
        İzin: `own_banking` ya da `ledger:read`. Müşteri yalnız gönderen ya da alıcı olduğu transferleri görür.
        `state` ile süzülür (ör. operasyon uzmanı `UNKNOWN` transferleri listeler).
      tags: [Transfer]
      parameters:
        - { name: state, in: query, schema: { type: string, enum: [CREATED, UNDER_REVIEW, PENDING_APPROVAL, RESERVED, SENT, UNKNOWN, COMPLETED, FAILED, REVERSED, REJECTED] } }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Sayfa
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Transfer" } }
                  next_cursor: { type: string, nullable: true }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/transfers/{id}:
    get:
      summary: Transfer ve durum geçmişi
      description: "İzin: `own_banking` ya da `ledger:read`. Müşteri yalnız gönderen ya da alıcı olduğu transferi görür (başkasınınki 403)."
      tags: [Transfer]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Transfer
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Transfer"
                  - type: object
                    properties:
                      events:
                        type: array
                        items:
                          type: object
                          properties:
                            from_state: { type: string, nullable: true }
                            to_state: { type: string }
                            note: { type: string, nullable: true }
                            at: { type: string, format: date-time }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/admin/invariants:
    get:
      summary: Defter değişmezlerini ölç (T-1 kanıtı)
      description: |
        İzin: `ledger:read`. Tek bir REPEATABLE READ snapshot'ında ölçer: her para biriminde Σ satırlar = 0,
        her kayıt dengeli, her hesapta bakiye özeti = defterden türetilen bakiye. `held_minor` = Σ aktif provizyon
        kontrolü kart adımında (E1) eklenecek; o zamana kadar `hold_mismatches` null.
      tags: [Defter]
      responses:
        "200":
          description: Ölçüm sonucu (`ok=false` ise bir değişmez bozulmuştur)
          content: { application/json: { schema: { $ref: "#/components/schemas/Invariants" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/webhooks/bank/transfer-status:
    post:
      summary: Bankanın transfer sonuç bildirimi
      description: |
        İzin: `system:callbacks` (yalnız sistem rolü; simülatör bu rolle çağırır). Referans, bizim transfer kimliğimizdir.
        Çift cevap sorun değildir: sonuçlanmış transfere gelen tekrar bildirim sessizce yok sayılır (para hareketi olmaz).
        Tutar ya da para birimi transferle uyuşmazsa `422 BANK_RESULT_MISMATCH`.
      tags: [Banka bildirimleri]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reference, status, amount_minor, currency]
              properties:
                reference: { type: string, format: uuid }
                status: { type: string, enum: [COMPLETED, REJECTED] }
                amount_minor: { type: integer, format: int64, minimum: 1 }
                currency: { type: string, enum: [TRY, USD, EUR] }
      responses:
        "200": { description: İşlendi ya da zaten sonuçlanmıştı }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { description: Bildirim transferle uyuşmuyor (`BANK_RESULT_MISMATCH`) ya da transfer dış transfer değil, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /api/v1/webhooks/bank/incoming:
    post:
      summary: Bankadan gelen transfer
      description: |
        İzin: `system:callbacks`. Alıcı müşteri hesabı alacaklanır, `NOSTRO` borçlanır. Banka referansı defterde tekildir:
        aynı bildirim iki kez gelirse ikinci kez yazılmaz (`duplicate: true`).
      tags: [Banka bildirimleri]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reference, beneficiary_iban, amount_minor, currency]
              properties:
                reference: { type: string, maxLength: 100 }
                beneficiary_iban: { type: string, minLength: 26, maxLength: 26 }
                amount_minor: { type: integer, format: int64, minimum: 1 }
                currency: { type: string, enum: [TRY, USD, EUR] }
      responses:
        "200":
          description: Yazıldı ya da zaten yazılmıştı
          content: { application/json: { schema: { type: object, properties: { ok: { type: boolean }, duplicate: { type: boolean } } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { description: Alıcı hesap yok (`BENEFICIARY_NOT_FOUND`) ya da para birimi uyuşmuyor, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /health:
    get:
      summary: Sağlık durumu (veritabanı bağlantısı dahil)
      description: Kimlik doğrulaması gerektirmez; Docker healthcheck ve `make verify` kullanır.
      tags: [Sistem]
      security: []
      responses:
        "200":
          description: Tüm kontroller geçti
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
              example: { status: ok, checks: { database: ok } }
        "503":
          description: En az bir kontrol başarısız
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
              example: { status: unavailable, checks: { database: unavailable } }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  headers:
    RequestID:
      description: İsteğin kimliği (loglarda `request_id`)
      schema: { type: string }
    IdempotentReplayed:
      description: "`true` ise yanıt, aynı Idempotency-Key ile daha önce yapılmış işlemin kayıtlı sonucudur"
      schema: { type: string, enum: ["true"] }

  parameters:
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    Cursor:
      name: cursor
      in: query
      description: Önceki sayfanın `next_cursor` değeri
      schema: { type: string }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Para hareketi yapan her POST'ta zorunludur (yoksa 400 `IDEMPOTENCY_KEY_REQUIRED`). Aynı anahtarla tekrar
        gelen istek işlemi yeniden yapmaz, ilk sonucu döndürür. Aynı anahtar farklı bir istekle kullanılırsa
        422 `IDEMPOTENCY_KEY_REUSED`. En fazla 255 karakter, boşluksuz görünür ASCII.
      schema: { type: string, maxLength: 255 }

  schemas:
    CustomerCreate:
      type: object
      required: [full_name, national_id]
      additionalProperties: false
      properties:
        full_name: { type: string, minLength: 2, maxLength: 200 }
        national_id: { type: string, pattern: "^[0-9]{11}$", description: "Kurgusal T.C. kimlik no; benzersiz" }
        email: { type: string, format: email }

    Customer:
      type: object
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid, nullable: true, description: "Giriş hesabı varsa" }
        full_name: { type: string }
        national_id: { type: string }
        email: { type: string, nullable: true }
        created_at: { type: string, format: date-time }

    AccountOpen:
      type: object
      required: [customer_id, kind, currency]
      additionalProperties: false
      properties:
        customer_id: { type: string, format: uuid }
        kind: { type: string, enum: [CHECKING, TIME_DEPOSIT] }
        currency: { type: string, enum: [TRY, USD, EUR] }
        maturity_date: { type: string, format: date, description: "Yalnız TIME_DEPOSIT; bugünden sonra" }

    Account:
      type: object
      properties:
        id: { type: string, format: uuid }
        customer_id: { type: string, format: uuid, nullable: true, description: "Bankanın iç hesaplarında null" }
        kind:
          type: string
          enum: [CHECKING, TIME_DEPOSIT, NOSTRO, EXTERNAL_CLEARING, CARD_SETTLEMENT, INTEREST_EXPENSE, WITHHOLDING_TAX, FX_POSITION, SUSPENSE, OPENING_EQUITY]
        currency: { type: string, enum: [TRY, USD, EUR] }
        name: { type: string }
        iban: { type: string, nullable: true, example: TR450099900000000000000001 }
        interest_product: { type: string, nullable: true }
        maturity_date: { type: string, format: date, nullable: true }
        status: { type: string, enum: [ACTIVE, CLOSED] }
        opened_at: { type: string, format: date-time }
        balance_minor: { type: integer, format: int64, description: "Bakiye (kuruş/sent)" }
        held_minor: { type: integer, format: int64, description: "Aktif kart provizyonları" }
        available_minor: { type: integer, format: int64, description: "Kullanılabilir = bakiye − provizyonlar" }
    AccountPosting:
      type: object
      properties:
        id: { type: string, format: uuid, description: Defter satırının kimliği }
        entry_id: { type: string, format: uuid }
        kind: { type: string, example: OPENING_BALANCE, description: "Kaydın türü (ör. OPENING_BALANCE, REVERSAL)" }
        description: { type: string }
        reference: { type: string, nullable: true, description: "İş kaydının kimliği (ör. transfer ID)" }
        reversal_of: { type: string, format: uuid, nullable: true }
        side: { type: string, enum: [DEBIT, CREDIT] }
        amount_minor: { type: integer, format: int64, minimum: 1 }
        balance_effect_minor: { type: integer, format: int64, description: "Bakiyeye etkisi; müşteri hesabında giriş +, çıkış −" }
        currency: { type: string, enum: [TRY, USD, EUR] }
        effective_at: { type: string, format: date-time, description: Geçerlilik (valör) zamanı }
        recorded_at: { type: string, format: date-time, description: "Kayıt zamanı (veritabanı saati; istemci belirleyemez)" }

    JournalEntry:
      type: object
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, example: REVERSAL }
        description: { type: string }
        reference: { type: string, nullable: true }
        effective_at: { type: string, format: date-time }
        recorded_at: { type: string, format: date-time }
        reversal_of: { type: string, format: uuid, nullable: true, description: Bu bir ters kayıtsa özgün kayıt }
        reversed_by: { type: string, format: uuid, nullable: true, description: Bu kayıt ters çevrildiyse ters kayıt }
        postings:
          type: array
          minItems: 2
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              account_id: { type: string, format: uuid }
              side: { type: string, enum: [DEBIT, CREDIT] }
              amount_minor: { type: integer, format: int64, minimum: 1 }
              currency: { type: string, enum: [TRY, USD, EUR] }

    ReverseRequest:
      type: object
      required: [reason]
      additionalProperties: false
      properties:
        reason: { type: string, minLength: 3, maxLength: 400 }
        effective_at:
          type: string
          format: date-time
          description: |
            Ters kaydın geçerlilik zamanı; verilmezse şimdi. Gelecekte ya da özgün kaydın geçerlilik zamanından
            önce olamaz. Geriye tarihli düzeltme için özgün kaydın zamanı verilebilir.

    TransferCreate:
      type: object
      required: [from_account_id, to_iban, amount_minor, currency]
      additionalProperties: false
      properties:
        type: { type: string, enum: [EFT, FAST], description: "Yalnız dış transferde; varsayılan FAST" }
        from_account_id: { type: string, format: uuid }
        to_iban: { type: string, minLength: 26, maxLength: 26 }
        amount_minor: { type: integer, format: int64, minimum: 1 }
        currency: { type: string, enum: [TRY, USD, EUR], description: Gönderen hesabın para birimiyle aynı olmalı }
        description: { type: string, maxLength: 200 }

    Transfer:
      type: object
      properties:
        id: { type: string, format: uuid }
        type: { type: string, enum: [INTERNAL, EFT, FAST] }
        state: { type: string, enum: [CREATED, UNDER_REVIEW, PENDING_APPROVAL, RESERVED, SENT, UNKNOWN, COMPLETED, FAILED, REVERSED, REJECTED] }
        from_account_id: { type: string, format: uuid }
        to_account_id: { type: string, format: uuid, nullable: true }
        to_iban: { type: string }
        amount_minor: { type: integer, format: int64 }
        currency: { type: string, enum: [TRY, USD, EUR] }
        description: { type: string }
        requested_by: { type: string, format: uuid }
        journal_entry_id: { type: string, format: uuid, nullable: true, description: Defter kaydı (banka içi) ya da ayırma kaydı (dış) }
        settlement_entry_id: { type: string, format: uuid, nullable: true, description: "Dış transfer: takasın kapanış kaydı" }
        reversal_entry_id: { type: string, format: uuid, nullable: true, description: "Dış transfer başarısızsa ters kayıt" }
        failure_code: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    Invariants:
      type: object
      properties:
        ok: { type: boolean }
        checked_at: { type: string, format: date-time }
        postings: { type: integer, format: int64 }
        accounts: { type: integer, format: int64 }
        totals_by_currency:
          type: array
          items:
            type: object
            properties:
              currency: { type: string }
              sum_minor: { type: integer, format: int64, description: "Her zaman 0 olmalı" }
        unbalanced_entries: { type: integer, format: int64 }
        summary_mismatches: { type: integer, format: int64 }
        hold_mismatches: { type: integer, format: int64, nullable: true }

    AuditRecord:
      type: object
      required: [id, at, actor_role, action, entity]
      properties:
        id: { type: string, format: uuid }
        at: { type: string, format: date-time }
        actor_id: { type: string, format: uuid, nullable: true, description: "Sistem süreçlerinde null" }
        actor_role: { $ref: "#/components/schemas/Role" }
        action: { type: string, example: transfer.approve }
        entity: { type: string, example: transfer }
        entity_id: { type: string, nullable: true }
        old_value: { nullable: true, description: Değişiklikten önceki değer (JSON) }
        new_value: { nullable: true, description: Değişiklikten sonraki değer (JSON) }
        request_id: { type: string, nullable: true }

    Role:
      type: string
      enum: [CUSTOMER, OPERATIONS, RISK_ANALYST, COMPLIANCE, AUDITOR, SYSTEM]

    LoginRequest:
      type: object
      required: [email, password]
      additionalProperties: false
      properties:
        email: { type: string, maxLength: 254 }
        password: { type: string, maxLength: 128, format: password }

    User:
      type: object
      required: [id, email, full_name, role, permissions]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        full_name: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        permissions:
          type: array
          items: { type: string }
          example: ["ledger:read", "profile:read", "transfers:approve"]

    Session:
      type: object
      required: [access_token, token_type, expires_at, user]
      properties:
        access_token: { type: string, description: "JWT (HS256); varsayılan ömür 15 dk" }
        token_type: { type: string, enum: [Bearer] }
        expires_at: { type: string, format: date-time }
        user: { $ref: "#/components/schemas/User" }

    Health:
      type: object
      required: [status, checks]
      properties:
        status: { type: string, enum: [ok, unavailable] }
        checks:
          type: object
          additionalProperties: { type: string, enum: [ok, unavailable] }

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Makine okunur hata kodu
              example: VALIDATION_ERROR
            message:
              type: string
              description: Kullanıcıya gösterilecek açıklama (Türkçe)
              example: currency zorunludur.

  responses:
    Unauthorized:
      description: Token yok ya da geçersiz (`UNAUTHORIZED`)
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Forbidden:
      description: Rolün bu işlem için izni yok (`FORBIDDEN`)
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    BadRequest:
      description: Girdi doğrulama hatası (`VALIDATION_ERROR`)
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    NotFound:
      description: Kayıt ya da uç nokta yok (`NOT_FOUND`)
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    MethodNotAllowed:
      description: Yöntem desteklenmiyor (`METHOD_NOT_ALLOWED`)
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    TooLarge:
      description: İstek gövdesi 1 MiB'tan büyük (`REQUEST_TOO_LARGE`)
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Internal:
      description: Beklenmeyen hata (`INTERNAL`); ayrıntı yalnız loglarda
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Timeout:
      description: İstek süre sınırını aştı (`TIMEOUT`)
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
